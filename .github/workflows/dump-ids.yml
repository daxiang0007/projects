name: dump-ids

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: dump
        env:
          U: ${{ secrets.OCI_USER_OCID }}
          T: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          echo "USER_B64=$(printf '%s' "$U" | base64 -w0)"
          echo "TENANCY_B64=$(printf '%s' "$T" | base64 -w0)"
