name: oci-attach-ip

# 给 a1-free 实例挂一个临时公网 IP（EPHEMERAL，与创建实例时的行为一致）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q oci cryptography
      - name: 挂公网 IP
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: us-sanjose-1
        run: |
          python -u - <<'PY'
          import os, hashlib, oci
          from cryptography.hazmat.primitives import serialization

          key = os.environ["OCI_PRIVATE_KEY"]
          priv = serialization.load_pem_private_key(key.encode(), password=None)
          der = priv.public_key().public_bytes(
              serialization.Encoding.DER,
              serialization.PublicFormat.SubjectPublicKeyInfo)
          fp = ":".join(f"{b:02x}" for b in hashlib.md5(der).digest())

          cfg = {
              "user": os.environ["OCI_USER_OCID"].strip(),
              "fingerprint": fp,
              "tenancy": os.environ["OCI_TENANCY_OCID"].strip(),
              "region": os.environ.get("OCI_REGION", "us-sanjose-1").strip(),
              "key_content": key,
          }
          tenancy = cfg["tenancy"]
          compute = oci.core.ComputeClient(cfg)
          network = oci.core.VirtualNetworkClient(cfg)

          insts = oci.pagination.list_call_get_all_results(
              compute.list_instances, compartment_id=tenancy).data
          inst = next((i for i in insts if i.display_name == "a1-free"), None)
          if not inst:
              raise SystemExit("没找到 a1-free 实例")
          print(f"实例: {inst.display_name} / {inst.lifecycle_state}")

          atts = oci.pagination.list_call_get_all_results(
              compute.list_vnic_attachments,
              compartment_id=tenancy, instance_id=inst.id).data
          if not atts:
              raise SystemExit("!! 实例没有 VNIC 挂载，网络已丢失，需要重建")

          for a in atts:
              v = network.get_vnic(a.vnic_id).data
              print(f"VNIC: {v.id[-12:]}  私网IP={v.private_ip}  公网IP={v.public_ip or '无'}")
              sub = network.get_subnet(v.subnet_id).data
              print(f"子网: {sub.display_name}  禁止公网IP={sub.prohibit_public_ip_on_vnic}")
              pips = network.list_private_ips(vnic_id=v.id).data
              primary = next((p for p in pips if p.is_primary), pips[0] if pips else None)
              if primary is None:
                  raise SystemExit("!! VNIC 上没有私网 IP，异常")
              print(f"主私网IP OCID: {primary.id}")

              if v.public_ip:
                  print(f"已有公网 IP，无需操作: {v.public_ip}")
                  continue
              if sub.prohibit_public_ip_on_vnic:
                  raise SystemExit("!! 该子网禁止挂公网 IP，需要在别的子网重建 VNIC")

              res = network.create_public_ip(
                  oci.core.models.CreatePublicIpDetails(
                      compartment_id=tenancy,
                      lifetime="EPHEMERAL",
                      private_ip_id=primary.id))
              print(f"\n>>> 已挂上公网 IP: {res.data.ip_address}")
              print(f">>> 用这个地址去改 v2rayN 节点 / 重连 Paseo")
          PY
