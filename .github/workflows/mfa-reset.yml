name: mfa-reset

# 重置身份域里某个用户的全部登录验证因素（等同控制台 Identity & Security →
# Domains → Default → Users → 该用户 → Reset MFA）。
# 做完后该用户用密码即可登录，登录时系统会要求重新登记新手机。
# 回滚：登录后重新登记 MFA 即可，无数据损失。

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "身份域里的 user id"
        required: true
        default: "85b5c1c5891a417cbbafeac0aa7e96c8"
      type:
        description: "清哪一类因素"
        required: true
        default: "MFA"
        type: choice
        options:
          - MFA
          - ALL
      confirm:
        description: '确认执行请输入 yes'
        required: true
        default: "no"

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q oci cryptography
      - name: 重置
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          TARGET_USER_ID: ${{ inputs.user_id }}
          FACTOR_TYPE: ${{ inputs.type }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          python -u - <<'PY'
          import os, hashlib, traceback
          import oci, oci.identity, oci.identity_domains
          from oci.identity_domains.models import (
              AuthenticationFactorsRemover, AuthenticationFactorsRemoverUser)
          from cryptography.hazmat.primitives import serialization

          if (os.environ.get("CONFIRM") or "").strip().lower() != "yes":
              raise SystemExit("confirm 不是 yes，退出，什么都没做")

          key = os.environ["OCI_PRIVATE_KEY"]
          priv = serialization.load_pem_private_key(key.encode(), password=None)
          der = priv.public_key().public_bytes(
              serialization.Encoding.DER,
              serialization.PublicFormat.SubjectPublicKeyInfo)
          fp = ":".join(f"{b:02x}" for b in hashlib.md5(der).digest())
          cfg = {
              "user": os.environ["OCI_USER_OCID"].strip(),
              "fingerprint": fp,
              "tenancy": os.environ["OCI_TENANCY_OCID"].strip(),
              "region": "us-sanjose-1",
              "key_content": key,
          }
          target = os.environ["TARGET_USER_ID"].strip()
          factor = os.environ.get("FACTOR_TYPE", "MFA").strip()

          iam = oci.identity.IdentityClient(cfg)
          domains = oci.pagination.list_call_get_all_results(
              iam.list_domains, compartment_id=cfg["tenancy"]).data
          dom = next(d for d in domains if not getattr(d, "is_hidden_on_login", False))
          print("domain:", dom.display_name, dom.url, flush=True)
          idc = oci.identity_domains.IdentityDomainsClient(cfg, service_endpoint=dom.url)

          def state(u):
              m = getattr(u, "urn_ietf_params_scim_schemas_oracle_idcs_extension_mfa_user", None)
              return (getattr(m, "mfa_status", None),
                      getattr(m, "preferred_authentication_factor", None),
                      getattr(m, "mfa_enabled_on", None))

          print("before:", state(idc.get_user(target).data), flush=True)

          remover = AuthenticationFactorsRemover(
              schemas=["urn:ietf:params:scim:schemas:oracle:idcs:AuthenticationFactorsRemover"],
              user=AuthenticationFactorsRemoverUser(value=target),
              type=factor,
          )
          try:
              resp = idc.create_authentication_factors_remover(
                  authentication_factors_remover=remover)
              print("reset response status:", resp.status, flush=True)
              print("reset response body:", getattr(resp.data, "id", None), flush=True)
          except Exception as e:
              print("RESET FAILED:", type(e).__name__, flush=True)
              print(str(e)[:1200], flush=True)
              traceback.print_exc()
              raise SystemExit(1)

          print("after:", state(idc.get_user(target).data), flush=True)
          print("=== 完成。现在用密码登录 cloud.oracle.com，登录时会要求登记新设备 ===", flush=True)
          PY
